name: Flutter checks

# Runs the app's static analysis and tests on every push and pull request.
# Uses no secrets: the tests run against in-memory fakes, not Supabase.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
