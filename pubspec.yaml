name: golden_maids
description: "Golden Maids – Professional Care. Trusted Homes. Domestic workforce recruitment and home-services app by Golden Legacy Domestic Workers Services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0
  # Navigation
  go_router: ^18.1.4
  # Backend (Auth, Database, Storage) – connected in Step 1.3
  supabase_flutter: ^2.18.3
  # Local settings (e.g. onboarding seen)
  shared_preferences: ^2.5.6
  # Images & loading states
  cached_network_image: ^4.0.3
  shimmer: ^3.0.0
  # Formatting (dates, AED currency)
  intl: ^0.20.2
  # Open the phone dialler, WhatsApp and email (Contact Agency)
  url_launcher: ^6.3.0
  # Choose a PDF or image for My Documents
  file_picker: ^13.0.0
  # Plays maids' video interviews (YouTube's official embedded player)
  youtube_player_iframe: ^6.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/banners/
    # Country flags for maid nationalities (public domain), by ISO code.
    - assets/flags/
    # Font licence (SIL OFL) – shown on the app's licences page.
    - assets/fonts/OFL-Outfit.txt

  # Bundled font (Latin). Outfit for headings and body text.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
