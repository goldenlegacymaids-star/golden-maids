name: golden_maids
description: "Golden Maids – Professional Care. Trusted Homes. Domestic workforce recruitment and home-services app by Golden Legacy Domestic Workers Services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0
  # Navigation
  go_router: ^18.1.4
  # Backend (Auth, Database, Storage) – connected in Step 1.3
  supabase_flutter: ^2.18.3
  # Typography (Poppins + Inter) – configured in Step 1.2
  google_fonts: ^8.2.1
  # Images & loading states
  cached_network_image: ^4.1.0
  shimmer: ^3.0.0
  # Formatting (dates, AED currency)
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/banners/
